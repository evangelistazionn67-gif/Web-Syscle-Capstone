services:
  app:
    image: mcr.microsoft.com/devcontainers/dotnet:8.0
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Payments__TestMode: "true"
      Security__DataKey: "codespace-demo-key-change-me-0123456789"
      ConnectionStrings__Syscle: "Server=db;Port=3306;Database=WebSyscleDB;User ID=root;Password=syscle;AllowPublicKeyRetrieval=True;"
    depends_on:
      - db
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: syscle
    volumes:
      - dbdata:/var/lib/mysql
volumes:
  dbdata:

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syscle - Customer Messages</title>
    <link rel="stylesheet" href="../Styles/global.css">
    <link rel="stylesheet" href="../Styles/shop_additions.css">
</head>
<body>
    <header class="top-nav">
        <div class="logo-area"><h2>Web-Syscle</h2><p>Admin Panel</p></div>
        <div class="search-container">
            <input type="text" id="main-search-input" class="search-bar" placeholder="Search customers...">
            <img src="../Icons_and_Buttons/icon_clear.jpg" alt="Clear" id="clear-search" class="search-action-icon">
            <img src="../Icons_and_Buttons/icon_search.jpg" alt="Search" id="execute-search" class="search-action-icon">
        </div>
        <div class="nav-actions"><a href="settings.html"><img src="../Icons_and_Buttons/icon_settings.jpg" alt="Settings" class="nav-icon settings-icon"></a><a href="account.html"><img src="../Icons_and_Buttons/Icon_Account.jpg" alt="Account" class="nav-icon profile-icon"></a></div>
    </header>
    <main class="sy-page">
        <button class="back-btn" onclick="location.href='adminhomepage.html'">&larr; Dashboard</button><h1>Customer Messages</h1>
        <div class="sy-msgwrap">
            <div class="sy-threads" id="threads"><p class="sy-empty">Loading...</p></div>
            <div class="sy-convo" id="convo"><p class="sy-empty">Pick a customer on the left to read and reply.</p></div>
        </div>
    </main>
    <div class="support-btn"><img src="../Icons_and_Buttons/icon_support.jpg" alt="Support" class="support-icon"></div>
    <script src="../JavaScripts/api.js"></script>
    <script src="../JavaScripts/admin_messages.js"></script>
    <script src="../JavaScripts/support.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syscle - My Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="../Styles/ui.css">
</head>
<body data-area="shared">
  
  <main class="account-wrapper sy-page">
      <a id="back-link" class="back-btn" href="homepage.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back</a>
      <h1>My Account</h1>
      <p class="sy-sub" id="acct-id"></p>
      <div class="sy-card">
          <div class="input-group"><input class="info-input" id="disp-username" readonly><span class="edit-icon" title="Edit"><i class="bi bi-pencil" aria-hidden="true"></i></span></div>
          <div class="input-group"><input class="info-input" id="disp-email" readonly><span class="edit-icon" title="Edit"><i class="bi bi-pencil" aria-hidden="true"></i></span></div>
          <div class="input-group"><input class="info-input" id="disp-contact" readonly><span class="edit-icon" title="Edit"><i class="bi bi-pencil" aria-hidden="true"></i></span></div>
          <div class="input-group"><input class="info-input" id="disp-password" value="Password: ********" readonly><span class="edit-icon" title="Change password"><i class="bi bi-pencil" aria-hidden="true"></i></span></div>
          <button class="sy-btn" onclick="logoutUser()" type="button">LOG-OUT</button>
      </div>
      <div class="sy-card" style="margin-top: 20px;">
          <h3>Security (2FA)</h3>
          <p class="sy-sub" id="tfa-status">Protect your account with Google Authenticator or Authy.</p>
          <button class="sy-btn" id="btn-setup-2fa" type="button">Setup 2FA</button>
      </div>
      <section id="history-section">
          <h2>My Orders</h2>
          <div class="sy-scroll"><table class="sy-table"><thead><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Pick-up</th><th>Status</th><th>Action</th></tr></thead><tbody id="history-body"></tbody></table></div>
      </section>
  </main>
  <script src="../JavaScripts/shell.js"></script><script src="../JavaScripts/api.js"></script><script src="../JavaScripts/account.js"></script>
    <script src="../JavaScripts/support.js"></script>
</body>
</html>

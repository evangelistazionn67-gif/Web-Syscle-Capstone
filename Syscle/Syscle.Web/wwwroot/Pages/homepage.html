<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syscle - Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="../Styles/ui.css">
</head>
<body data-area="shop" data-search="Search parts, brands, categories...">
  <main>
  <section class="sy-section" style="padding-top:28px"><header><div><h1>Shop</h1><p>Browse by bike type, or scroll to see every part.</p></div></header>
    <div class="category-grid" id="cat-grid"></div></section>
  <section class="sy-shelf" id="promo-strip" style="padding-top:18px;padding-bottom:0"></section>
  <section class="sy-shelf" id="featured" hidden><h2>Featured <span class="sy-tagsave">STAFF PICKS</span></h2><div class="sy-products" id="featured-products"></div></section>
  <section class="sy-shelf" id="bundles" hidden><h2>Bundle deals <span class="sy-tagsave">SPECIAL OFFERS</span></h2><div class="sy-bundlegrid" id="bundle-list"></div></section>
  <section class="sy-shelf" id="shelf"><h2>All parts <span id="shelf-count"></span></h2>
    <div class="sy-shelfbar"><div class="sy-fbar" id="shelf-chips"></div>
      <div class="sy-shelfctl"><label><input type="checkbox" id="shelf-instock"> In stock only</label>
        <select id="shelf-sort" aria-label="Sort"><option value="">Recommended</option><option value="top">Best selling</option><option value="rated">Top rated</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name: A to Z</option></select></div></div>
    <div class="sy-products" id="shelf-products"></div></section>
  </main>
  <script src="../JavaScripts/shell.js"></script><script src="../JavaScripts/api.js"></script><script src="../JavaScripts/customer.js"></script><script src="../JavaScripts/support.js"></script>
</body>
</html>

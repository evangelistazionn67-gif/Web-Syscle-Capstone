<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syscle - Transactions History</title>
    <link rel="stylesheet" href="../Styles/global.css">
    <link rel="stylesheet" href="../Styles/admin_transaction_history.css">
    <link rel="stylesheet" href="../Styles/shop_additions.css">
</head>
<body>
    <header class="top-nav">
        <div class="logo-area"><h2>Web-Syscle</h2><p>Admin Panel</p></div>
        <div class="search-container">
            <input type="text" id="main-search-input" class="search-bar" placeholder="Search orders...">
            <img src="../Icons_and_Buttons/icon_clear.jpg" alt="Clear" id="clear-search" class="search-action-icon">
            <img src="../Icons_and_Buttons/icon_search.jpg" alt="Search" id="execute-search" class="search-action-icon">
        </div>
        <div class="nav-actions"><a href="settings.html"><img src="../Icons_and_Buttons/icon_settings.jpg" alt="Settings" class="nav-icon settings-icon"></a><a href="account.html"><img src="../Icons_and_Buttons/Icon_Account.jpg" alt="Account" class="nav-icon profile-icon"></a></div>
    </header>
    <main class="sy-page">
        <button class="back-btn" onclick="location.href='adminhomepage.html'">&larr; Dashboard</button><h1>Transactions History</h1>
        <div class="sy-cards"><div class="sy-stat">TOTAL<b id="val-total">0</b></div><div class="sy-stat">COMPLETED<b id="val-completed">0</b></div><div class="sy-stat">PENDING<b id="val-pending">0</b></div><div class="sy-stat">CANCELLED<b id="val-cancelled">0</b></div></div>

        <div class="sy-filters sy-quick" id="quick-bar">
            <button class="sy-btn small" id="q-today" type="button" data-quick="today">TODAY</button>
            <button class="sy-btn small ghost" type="button" data-quick="all">ALL DATES - ALL</button>
            <button class="sy-btn small ghost" type="button" data-quick="Completed">ALL DATES - COMPLETED</button>
            <button class="sy-btn small ghost" type="button" data-quick="Pending">ALL DATES - PENDING</button>
            <button class="sy-btn small ghost" type="button" data-quick="Cancelled">ALL DATES - CANCELLED</button>
            <button class="sy-btn small ghost" type="button" id="btn-export" style="margin-left:auto;">EXPORT CSV</button>
        </div>
        <p class="sy-sub" id="range-note"></p>

        <div class="sy-filters">
            <input type="text" id="f-search" class="sy-input" placeholder="Order number or customer...">

            <label style="font-size:12px; font-weight:bold; align-self:center;">From:</label>
            <input type="date" id="f-start-date" class="sy-input" style="width:auto;">

            <label style="font-size:12px; font-weight:bold; align-self:center;">To:</label>
            <input type="date" id="f-end-date" class="sy-input" style="width:auto;">

            <select id="f-status" class="sy-input">
                <option value="">All status</option>
                <option>Pending</option>
                <option>Completed</option>
                <option>Cancelled</option>
            </select>
            <button class="sy-btn" id="btn-filter" type="button">FILTER</button>
            <button class="sy-btn ghost" id="btn-reset" type="button">RESET</button>
        </div>
        <div class="sy-scroll"><table class="sy-table"><thead><tr><th>ORDER</th><th>DATE</th><th>CUSTOMER</th><th>ITEMS</th><th>TOTAL</th><th>PAYMENT</th><th>PICK-UP</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody id="transaction-table-body"></tbody></table></div>
    </main>
    <div class="support-btn"><img src="../Icons_and_Buttons/icon_support.jpg" alt="Support" class="support-icon"></div>
    <script src="../JavaScripts/api.js"></script>
    <script src="../JavaScripts/admin_history.js"></script>
    <script src="../JavaScripts/support.js"></script>
</body>
</html>

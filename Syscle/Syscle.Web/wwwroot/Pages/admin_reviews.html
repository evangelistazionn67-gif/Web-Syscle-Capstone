<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syscle - Review Moderation</title>
    <link rel="stylesheet" href="../Styles/global.css">
    <link rel="stylesheet" href="../Styles/shop_additions.css">
</head>
<body>
    <header class="top-nav">
        <div class="logo-area"><h2>Web-Syscle</h2><p>Admin Panel</p></div>
        <div class="search-container">
            <input type="text" id="main-search-input" class="search-bar" placeholder="Search reviews...">
            <img src="../Icons_and_Buttons/icon_clear.jpg" alt="Clear" id="clear-search" class="search-action-icon">
            <img src="../Icons_and_Buttons/icon_search.jpg" alt="Search" id="execute-search" class="search-action-icon">
        </div>
        <div class="nav-actions"><a href="settings.html"><img src="../Icons_and_Buttons/icon_settings.jpg" alt="Settings" class="nav-icon settings-icon"></a><a href="account.html"><img src="../Icons_and_Buttons/Icon_Account.jpg" alt="Account" class="nav-icon profile-icon"></a></div>
    </header>
    <main class="sy-page">
        <button class="back-btn" onclick="location.href='adminhomepage.html'">&larr; Dashboard</button><h1>Review Moderation</h1>
        <p class="sy-sub">Monitor and delete reviews that violate community standards.</p>

        <div class="sy-scroll">
            <table class="sy-table">
                <thead>
                    <tr><th>DATE</th><th>PRODUCT</th><th>CUSTOMER</th><th>RATING</th><th>COMMENT</th><th>ACTION</th></tr>
                </thead>
                <tbody id="review-table-body"></tbody>
            </table>
        </div>
    </main>
    <div class="support-btn"><img src="../Icons_and_Buttons/icon_support.jpg" alt="Support" class="support-icon"></div>
    <script src="../JavaScripts/api.js"></script>
    <script src="../JavaScripts/admin_reviews.js"></script>
    <script src="../JavaScripts/support.js"></script>
</body>
</html>

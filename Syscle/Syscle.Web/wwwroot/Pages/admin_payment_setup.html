<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syscle - Payment methods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="../Styles/ui.css">
</head>
<body data-area="admin">
    
    <main class="sy-page">
        <button class="back-btn" onclick="location.href='adminhomepage.html'"><i class="bi bi-arrow-left" aria-hidden="true"></i> Dashboard</button><h1>Payment methods</h1>
        <div class="sy-card"><div class="sy-switch"><span>Cash (pay at pick-up or to the rider, and at the counter)</span><button class="toggle-btn" data-code="cash" type="button">ON</button></div></div>
        <div class="sy-card">
            <div class="sy-switch"><span>Online payment (PayMongo): QR, GCash, Maya, card</span><button class="toggle-btn" data-code="paymongo" type="button">ON</button></div>
            <p class="sy-sub" id="st-paymongo">Checking...</p>
        </div>

        <button class="sy-btn" id="btn-apply" type="button">APPLY CHANGES</button>
    </main>
    <script src="../JavaScripts/shell.js"></script><script src="../JavaScripts/api.js"></script>
    <script src="../JavaScripts/admin_payment.js"></script>
    <script src="../JavaScripts/support.js"></script>
</body>
</html>

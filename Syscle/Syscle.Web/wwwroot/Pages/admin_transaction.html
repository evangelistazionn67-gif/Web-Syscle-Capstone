<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syscle - Walk-in Transaction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="../Styles/ui.css">
</head>
<body data-area="admin">
  
<main class="sy-page">
    <h1>Walk-in sale</h1><p class="sy-sub">Scan the QR label on each item, check the items, then confirm the money. The sale is recorded only after both checks.</p>
    <div class="sy-pos">
      <div class="sy-card"><div class="sy-toolbar" style="margin:0 0 10px"><h3>Items</h3><button class="sy-btn small" id="btn-scan-item" type="button"><i class="bi bi-qr-code-scan" aria-hidden="true"></i> Scan item</button></div>
        <div class="pos-search-wrapper"><input type="text" id="pos-item-search" class="sy-input" placeholder="Search an item to add..." autocomplete="off">
          <div class="pos-dropdown-list" id="pos-search-results"></div></div>
        <div id="transaction-items-container" class="sy-items"></div></div>
      <div class="sy-card"><h3>Summary</h3><p id="current-date">Date:</p>
        <label>Customer name (optional)</label><input type="text" id="walkin-name" class="sy-input walkin-name-input" maxlength="80">
        <label>Payment</label><select id="pos-payment" class="sy-input"></select>
        <p class="cost-breakdown-title">Cost Breakdown</p><div id="cost-breakdown-container" class="sy-breakdown"></div>
        <div class="total-cost-row"><strong id="pos-total">Total Due: 0</strong></div>
        <p class="order-number-text" id="order-number-text">TRANS-ID: (Generated after saving)</p>
        <button class="sy-btn" id="btn-generate" type="button">Review and record sale</button></div>
    </div>
  </main>
  <script src="../JavaScripts/shell.js"></script><script src="../JavaScripts/api.js"></script><script src="../JavaScripts/scan.js"></script><script src="../JavaScripts/admin_transaction.js"></script>
    <script src="../JavaScripts/support.js"></script>
</body>
</html>

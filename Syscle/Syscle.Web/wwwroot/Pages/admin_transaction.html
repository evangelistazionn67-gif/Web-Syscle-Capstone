<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syscle - Walk-in Transaction</title><link rel="stylesheet" href="../Styles/global.css"><link rel="stylesheet" href="../Styles/admin_transaction_styles.css"><link rel="stylesheet" href="../Styles/shop_additions.css">
</head>
<body>
  <header class="top-nav">
    <div class="logo-area"><h2>Web-Syscle</h2><p>Admin Panel</p></div>
    <div class="search-container">
      <input type="text" id="main-search-input" class="search-bar" placeholder="Search...">
      <img src="../Icons_and_Buttons/icon_clear.jpg" alt="Clear" id="clear-search" class="search-action-icon">
      <img src="../Icons_and_Buttons/icon_search.jpg" alt="Search" id="execute-search" class="search-action-icon">
    </div>
    <div class="nav-actions"><a href="settings.html"><img src="../Icons_and_Buttons/icon_settings.jpg" alt="Settings" class="nav-icon settings-icon"></a><a href="account.html"><img src="../Icons_and_Buttons/Icon_Account.jpg" alt="Account" class="nav-icon profile-icon"></a></div>
  </header>
<main class="sy-page">
    <button class="back-btn" onclick="location.href='adminhomepage.html'">&larr; Dashboard</button><h1>Walk-in Transaction</h1>
    <div class="sy-pos">
      <div class="sy-card"><h3>Items</h3>
        <div class="pos-search-wrapper"><input type="text" id="pos-item-search" class="sy-input" placeholder="Search an item to add..." autocomplete="off">
          <div class="pos-dropdown-list" id="pos-search-results"></div></div>
        <div id="transaction-items-container" class="sy-items"></div></div>
      <div class="sy-card"><h3>Summary</h3><p id="current-date">Date:</p>
        <label>Customer name (optional)</label><input type="text" id="walkin-name" class="sy-input walkin-name-input" maxlength="80">
        <label>Payment</label><select id="pos-payment" class="sy-input"></select>
        <p class="cost-breakdown-title">Cost Breakdown</p><div id="cost-breakdown-container" class="sy-breakdown"></div>
        <div class="total-cost-row"><strong id="pos-total">Total Due: 0</strong></div>
        <p class="order-number-text" id="order-number-text">TRANS-ID: (Generated after saving)</p>
        <button class="sy-btn" id="btn-generate" type="button">GENERATE TRANSACTION</button></div>
    </div>
  </main>
  <div class="support-btn"><img src="../Icons_and_Buttons/icon_support.jpg" alt="Support" class="support-icon"></div>
  <script src="../JavaScripts/api.js"></script><script src="../JavaScripts/admin_transaction.js"></script>
    <script src="../JavaScripts/support.js"></script>
</body>
</html>

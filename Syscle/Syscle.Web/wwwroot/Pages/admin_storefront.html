<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syscle - Store-front Config</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="../Styles/ui.css">
</head>
<body data-area="admin">
  
<div class="sy-page sy-toolbar"><div><button class="back-btn" onclick="location.href='adminhomepage.html'"><i class="bi bi-arrow-left" aria-hidden="true"></i> Dashboard</button><h1>Store-front Config</h1><p class="sy-sub">Add bike types, give each a picture, then add the parts that belong to it.</p></div><button class="sy-btn accent" id="btn-add-category" type="button">+ Add Bike Category</button></div>
  <main class="customer-dashboard"><div class="category-grid"></div></main>
  <div class="sy-modal" id="add-category-modal"><div class="sy-modal-box"><h3>Add Category</h3>
    <label>Category title</label><input type="text" id="new-category-name" maxlength="60">
    <label>Picture (optional, .jpg/.png/.webp under 2 MB)</label><input type="file" id="new-category-file" accept="image/*">
    <div class="sy-modal-actions"><button class="sy-btn ghost" id="close-modal-btn" type="button">Cancel</button><button class="sy-btn" id="btn-save-category" type="button">Save</button></div></div></div>
  <script src="../JavaScripts/shell.js"></script><script src="../JavaScripts/api.js"></script><script src="../JavaScripts/admin.js"></script>
    <script src="../JavaScripts/support.js"></script>
</body>
</html>

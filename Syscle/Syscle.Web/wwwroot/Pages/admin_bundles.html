<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syscle - Bundle Offers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="../Styles/ui.css">
</head>
<body data-area="admin">
    
    <main class="sy-page">
        <button class="back-btn" onclick="location.href='adminhomepage.html'"><i class="bi bi-arrow-left" aria-hidden="true"></i> Dashboard</button><h1>Bundle Offers</h1>
        <p class="sy-sub" id="bundle-note"></p>

        <div class="sy-card">
            <h3>Create a Bundle</h3>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <select id="nb-product" class="sy-input" style="flex:1;"></select>
                <button class="sy-btn" id="btn-add-to-box" type="button">+ Add Item</button>
                <button class="sy-btn" id="btn-bogo" type="button" style="background:#ff5a1f;">Make BOGO (2 of this item)</button>
            </div>

            <div id="bundle-box" style="border:2px dashed #ccc; padding:10px; min-height:60px; margin-bottom:15px; font-size:14px;">
                <i style="color:#888;">No items added yet.</i>
            </div>

            <div class="sy-formrow" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
                <select id="nb-kind" class="sy-input" aria-label="Type"><option value="Bundle">Bundle (parts)</option><option value="Package">Complete bike package</option></select>
                <input id="nb-desc" class="sy-input" maxlength="500" placeholder="Describe the bundle (what it is for, who it suits)" aria-label="Bundle description" style="flex:1;min-width:240px">
                <label for="nb-image" class="sy-sublink" style="margin:0">Picture (optional)</label><input id="nb-image" class="sy-input" type="file" accept="image/*" style="max-width:260px">
                <select id="nb-season" class="sy-input" aria-label="Season"><option value="">No season</option></select>
                <label for="nb-start">Starts</label><input id="nb-start" class="sy-input" type="date"><label for="nb-end">Ends</label><input id="nb-end" class="sy-input" type="date">
            </div>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <select id="nb-pct" class="sy-input" style="width:120px;">
                    <option value="1">1%</option>
                    <option value="5">5%</option>
                    <option value="10">10%</option>
                    <option value="20">20%</option>
                    <option value="50" selected>50% (BOGO)</option>
                    <option value="100">100%</option>
                </select>
                <button class="sy-btn" id="nb-create" type="button">Create Bundle</button>
                <button class="sy-btn ghost" id="nb-generate" type="button">Auto-Find Slow Items</button>
            </div>
        </div>

        <div class="sy-scroll"><table class="sy-table"><thead><tr><th>OFFER</th><th>PARTS</th><th>LIST PRICE</th><th>OFFER PRICE</th><th>DISCOUNT</th><th>STATUS</th><th>ACTIONS</th></tr></thead><tbody id="bundle-table-body"></tbody></table></div>
    </main>
    <script src="../JavaScripts/shell.js"></script><script src="../JavaScripts/api.js"></script>
    <script src="../JavaScripts/admin_bundles.js"></script>
    <script src="../JavaScripts/support.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt</title>
<style>
  :root{--ink:#111827;--mute:#6b7280;--line:#d1d5db;--ok:#15803d;--bad:#b91c1c}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#e5e7eb;color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px 12px;background:#111827}
  .bar button,.bar a{font:inherit;font-weight:700;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;text-decoration:none;background:#374151;color:#fff}
  .bar button.main{background:#f97316}
  .bar .seg{display:inline-flex;border-radius:8px;overflow:hidden}.bar .seg button{border-radius:0;background:#374151}.bar .seg button.on{background:#f97316}
  .paper{width:min(100%,380px);margin:16px auto;background:#fff;padding:18px 18px 22px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
  body.a4 .paper{width:min(100%,760px);padding:34px 40px}
  .c{text-align:center}.store{font-size:20px;font-weight:800;letter-spacing:.3px;margin:0}.sm{font-size:12px;color:var(--mute)}
  .ttl{margin:10px 0 4px;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:13px}
  .stamp{display:inline-block;margin:6px 0;border:2px solid;border-radius:6px;padding:2px 12px;font-weight:800;letter-spacing:2px;transform:rotate(-4deg)}
  .stamp.PAID{color:var(--ok)}.stamp.UNPAID,.stamp.CANCELLED,.stamp.REFUNDED{color:var(--bad)}
  hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}.meta span:nth-child(odd){color:var(--mute)}.meta span:nth-child(even){text-align:right;word-break:break-word}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);text-align:left;border-bottom:1px solid var(--line);padding:4px 0}
  th:last-child,td:last-child{text-align:right}td{padding:5px 0;vertical-align:top}td.q{white-space:nowrap;padding:5px 8px;text-align:center}
  td small{display:block;color:var(--mute)}
  .tot{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}.tot span:nth-child(even){text-align:right}
  .tot .big{font-size:18px;font-weight:800;border-top:2px solid var(--ink);padding-top:6px;margin-top:4px}
  .qr{display:block;margin:10px auto 2px;width:110px;height:110px}
  .foot{margin-top:8px;font-size:12px;color:var(--mute);text-align:center}
  .err{max-width:380px;margin:40px auto;background:#fff;padding:24px;border-radius:12px;text-align:center}
  @page{margin:6mm}
  @media print{
    body{background:#fff}.bar{display:none!important}
    .paper{box-shadow:none;margin:0 auto;width:80mm;padding:0}
    body.a4 .paper{width:100%;padding:0}
  }
  body.embed .bar{display:none}body.embed{background:#fff}body.embed .paper{box-shadow:none;margin:0 auto}
</style>
</head>
<body>
<div class="bar" id="bar">
  <button class="main" id="b-print" type="button">Print receipt</button>
  <span class="seg" aria-label="Paper size"><button type="button" id="p-80" class="on">80 mm roll</button><button type="button" id="p-a4">A4 / Letter</button></span>
  <button type="button" id="b-close">Close</button>
</div>
<div id="out"><div class="err">Loading your receipt...</div></div>
<script>
(function () {
  'use strict';
  var qp = new URLSearchParams(location.search), id = parseInt(qp.get('order'), 10), admin = qp.get('a') === '1', embed = qp.get('embed') === '1';
  var out = document.getElementById('out');
  if (embed) document.body.classList.add('embed');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function peso(n) { return '₱' + (+n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function dt(s) { if (!s) return ''; var d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('en-PH', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
  function fail(m) { out.innerHTML = '<div class="err"><b>' + esc(m) + '</b><p class="sm">Sign in again, then press the Receipt button on the order.</p></div>'; }
  document.getElementById('b-print').onclick = function () { window.print(); };
  document.getElementById('b-close').onclick = function () { window.close(); setTimeout(function () { history.length > 1 ? history.back() : (location.href = admin ? 'admin_transaction_history.html' : 'orders.html'); }, 150); };
  function paper(a4) { document.body.classList.toggle('a4', a4); document.getElementById('p-a4').classList.toggle('on', a4); document.getElementById('p-80').classList.toggle('on', !a4); try { localStorage.setItem('sy.paper', a4 ? 'a4' : '80'); } catch (e) { } }
  document.getElementById('p-80').onclick = function () { paper(false); }; document.getElementById('p-a4').onclick = function () { paper(true); };
  try { if (localStorage.getItem('sy.paper') === 'a4') paper(true); } catch (e) { }
  if (!id) return fail('No order was chosen.');

  fetch(admin ? '/api/admin/orders/' + id + '/receipt' : '/api/orders/' + id + '/receipt', { credentials: 'same-origin', headers: admin ? { 'X-Area': 'admin' } : {} })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Could not load the receipt.'); return j; }); })
    .then(draw).catch(function (e) { fail(e.message); });

  function draw(r) {
    var s = r.store || {}; document.title = 'Receipt ' + r.code;
    var rows = (r.items || []).map(function (i) {
      var opt = [i.size, i.color].filter(Boolean).join(' / ');
      return '<tr><td>' + esc(i.name) + '<small>' + (opt ? esc(opt) + ' &middot; ' : '') + peso(i.price) + ' each</small></td><td class="q">' + i.qty + '</td><td>' + peso(i.line) + '</td></tr>';
    }).join('');
    var meta = [['Receipt no.', r.code], ['Date', dt(r.date)]];
    if (r.paidAt) meta.push(['Paid on', dt(r.paidAt)]);
    meta.push(['Customer', r.customer || 'Walk-in']);
    meta.push(['Payment', (r.payment || '') + (r.paymentRef ? ' · Ref ' + r.paymentRef : '')]);
    meta.push([r.fulfillment === 'Delivery' ? 'Delivery' : (r.channel === 'Walk-in' ? 'Sale' : 'Pick-up'), r.fulfillment === 'Delivery' ? (r.address || '') : (r.channel === 'Walk-in' ? 'In store' : (r.pickup ? new Date(r.pickup).toLocaleDateString('en-PH') : 'In store'))]);
    if (r.fulfillment === 'Delivery' && r.phone) meta.push(['Phone', r.phone]);
    if (r.cashier) meta.push(['Received by', r.cashier]);
    var tot = '<span>Items</span><span>' + peso(r.subtotal) + '</span>';
    if (+r.bundleDiscount > 0) tot += '<span>Bundle discount</span><span>-' + peso(r.bundleDiscount) + '</span>';
    if (+r.discount > 0) tot += '<span>Promo' + (r.promoCode ? ' ' + esc(r.promoCode) : '') + '</span><span>-' + peso(r.discount) + '</span>';
    if (+r.deliveryFee > 0) tot += '<span>Delivery fee</span><span>' + peso(r.deliveryFee) + '</span>';
    tot += '<span class="big">TOTAL</span><span class="big">' + peso(r.total) + '</span>';
    if (r.refunded != null) tot += '<span>Refunded</span><span>-' + peso(r.refunded) + '</span>';
    out.innerHTML = '<div class="paper">' +
      '<div class="c"><p class="store">' + esc(s.name || 'Web-Syscle') + '</p>' +
      (s.address ? '<div class="sm">' + esc(s.address) + '</div>' : '') + (s.phone ? '<div class="sm">Tel ' + esc(s.phone) + '</div>' : '') + (s.hours ? '<div class="sm">' + esc(s.hours) + '</div>' : '') + (s.tin ? '<div class="sm">TIN ' + esc(s.tin) + '</div>' : '') +
      '<div class="ttl">Sales receipt</div><div class="stamp ' + esc(r.paymentStatus) + '">' + esc(r.paymentStatus) + '</div></div><hr>' +
      '<div class="meta">' + meta.map(function (m) { return '<span>' + esc(m[0]) + '</span><span>' + esc(m[1]) + '</span>'; }).join('') + '</div><hr>' +
      '<table><thead><tr><th>Item</th><th style="text-align:center">Qty</th><th>Amount</th></tr></thead><tbody>' + rows + '</tbody></table><hr>' +
      '<div class="tot">' + tot + '</div>' +
      '<img class="qr" id="qr" alt="QR code of ' + esc(r.code) + '" src="/api/qr?text=' + encodeURIComponent(r.code) + '">' +
      '<div class="foot">' + esc(s.footer || '') + (r.paymentStatus !== 'PAID' ? '<br><b>This is not proof of payment until it shows PAID.</b>' : '') + '</div></div>';
    // one click: the print window opens by itself when the page was opened with print=1 (the QR picture is waited for, then the page prints)
    if (qp.get('print') === '1') {
      var done = false, go = function () { if (done) return; done = true; setTimeout(function () { window.print(); }, 250); };
      var img = document.getElementById('qr'); if (img.complete) go(); else { img.onload = go; img.onerror = go; setTimeout(go, 2500); }
    }
  }
})();
</script>
</body>
</html>

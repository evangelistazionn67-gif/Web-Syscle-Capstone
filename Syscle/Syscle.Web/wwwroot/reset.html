<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Web-Syscle - Choose a new password</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="/Styles/ui.css"></head>
<body data-area="auth"><div class="sy-auth"><aside class="sy-auth-art"><a class="sy-logo" href="/index.html"><b>Web<i>-</i>Syscle</b><span>Shop &amp; Customize</span></a>
<div><h2>Back on <em>track.</em></h2><p>Choose a new password and you can log in again.</p></div><small style="color:#64748b">&copy; Web-Syscle</small></aside>
<section class="sy-auth-form"><div class="sy-auth-box"><a class="back-btn sy-authback" href="/login.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to login</a><div class="form-container" style="display:block">
<h1>New password</h1><p class="lead">Choose a new password (8 to 14 characters).</p>
<form class="auth-form" onsubmit="return false;">
<div class="input-group"><label for="new-password">New password</label><input type="password" id="new-password" maxlength="14" autocomplete="new-password"></div>
<div class="input-group"><label for="new-confirm">Confirm new password</label><input type="password" id="new-confirm" maxlength="14" autocomplete="new-password"></div>
<button type="submit" class="pill-btn" id="btn-save-password">SAVE PASSWORD</button>
<div class="switch-form-text"><a href="/login.html" class="link-text">Back to Login</a></div></form></div></div></section></div>
<script src="reset.js"></script></body></html>
